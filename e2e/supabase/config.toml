# Supabase LOCAL usado só pelos testes E2E (agentes médico e paciente).
# Portas 553xx para não conflitar com outros projetos locais (54321…).
# As pastas migrations/ e functions/ são copiadas de ../../supabase pelo
# script e2e/scripts/db.mjs — não edite as cópias.
project_id = "prontuario-e2e"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false
port = 55329

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = false
port = 55323

[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:8092"
additional_redirect_urls = ["http://127.0.0.1:8092"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Igual à produção: sem autocadastro público.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.rate_limit]
email_sent = 2
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000

[auth.email]
enabled = true
enable_confirmations = false
secure_password_change = false

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 55383
deno_version = 2

[analytics]
enabled = false
port = 55327

[functions.admin-usuarios]
verify_jwt = false
